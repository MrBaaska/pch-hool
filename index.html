<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замын 2-р ангийн хоол захиалга</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-blue-50 to-emerald-50 min-h-screen text-slate-800">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Толгой хэсэг -->
        <header class="text-center mb-10">
            <h1 class="text-3xl font-ext500 font-bold text-indigo-900 mb-2">🍽️ Хоол захиалга</h1>
            <p class="text-slate-600">Салбараа сонгоод хоолоо захиалж, саналаа үлдээнэ үү.</p>
        </header>

        <!-- Захиалгын Форм -->
        <div class="glass shadow-xl rounded-2xl p-6 md:p-8 mb-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6 flex flex-wrap items-center justify-between gap-3">
                <span class="flex items-center gap-2"><span>📝</span> Захиалга өгөх</span>
                <button type="button" onclick="copyBankAccount(this)" class="text-right text-sm font-medium text-indigo-700 hover:text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-lg px-2 py-1" aria-label="Дансны дугаарыг хуулах">
                    <span class="block">370005005059184108</span>
                    <span class="block text-xs text-slate-500">Хаан банк · Пүрэвдумаа Нандин</span>
                    <span class="block text-xs text-emerald-700" aria-live="polite"></span>
                </button>
            </h2>
            
            <form id="orderForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Салбар сонгох -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Тасаг / Салбар</label>
                        <select id="department" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80">
                    <option value="Удирдлага">Удирдлага</option>
                    <option value="Техник тасаг">Техник тасаг</option>
                    <option value="Санхүү тасаг">Санхүү тасаг</option>
                    <option value="Хүний нөөц">Хүний нөөц</option>
                    <option value="Зам оношилгоо">Зам оношилгоо</option>
                    <option value="АХО">АХО</option>
                    <option value="Замын 16-р хэсэг">Замын 16-р хэсэг</option>
                    <option value="Бусад">Бусад</option>
                        </select>
                    </div>

                    <!-- Нэр -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Таны нэр</label>
                        <input type="text" id="employeeName" required placeholder="Жишээ: Бат-Эрдэнэ" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80">
                    </div>
                </div>

                <!-- Өдрөөр цэс харах хэсэг -->
                <div>
                    <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
                        <label for="menuDate" class="block text-sm font-medium text-slate-700">Өдрөөр хоол харах</label>
                        <div class="flex items-center gap-2">
                            <button type="button" id="previousDay" class="px-3 py-2 rounded-lg border border-slate-200 bg-white/80 hover:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Өмнөх өдөр">←</button>
                            <input type="date" id="menuDate" class="px-3 py-2 rounded-lg border border-slate-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button type="button" id="nextDay" class="px-3 py-2 rounded-lg border border-slate-200 bg-white/80 hover:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Дараагийн өдөр">→</button>
                        </div>
                    </div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Сонгосон өдрийн хоол</label>
                    <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Supabase-с динамикаар орж ирнэ -->
                        <p class="text-sm text-slate-500 col-span-3">Цэс ачаалж байна...</p>
                    </div>
                </div>

                <!-- Тоо ширхэг -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Авах тоо ширхэг</label>
                    <input type="number" id="quantity" min="1" value="1" required class="w-full md:w-1/3 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3.5 rounded-xl transition shadow-lg shadow-indigo-500/30">
                    Захиалга илгээх
                </button>
            </form>
        </div>

        <section class="glass shadow-xl rounded-2xl p-6 md:p-8 mb-8" aria-labelledby="myOrdersHeading">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                    <h2 id="myOrdersHeading" class="text-xl font-semibold text-slate-800">📋 Илгээсэн захиалгууд</h2>
                    
                </div>
                <button type="button" id="loadMyOrders" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl transition">
                    Шинэчлэх
                </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="ordersDate" class="block text-sm font-medium text-slate-700 mb-1">Хоолны өдөр</label>
                    <input type="date" id="ordersDate" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                </div>
                <div>
                    <label for="ordersDepartment" class="block text-sm font-medium text-slate-700 mb-1">Тасаг / Салбар</label>
                    <select id="ordersDepartment" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                        <option value="">Бүх салбар</option>
                    </select>
                </div>
                <div hidden>
                    <label for="ordersEmployee" class="block text-sm font-medium text-slate-700 mb-1">Ажилтан</label>
                    <select id="ordersEmployee" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                        <option value="">Бүх ажилтан</option>
                    </select>
                </div>
                <div hidden>
                    <label for="ordersMeal" class="block text-sm font-medium text-slate-700 mb-1">Хоол</label>
                    <select id="ordersMeal" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                        <option value="">Бүх хоол</option>
                    </select>
                </div>
            </div>
            <div id="myOrdersContainer" aria-live="polite">
                <p class="text-sm text-slate-500">Захиалгуудыг ачаалж байна...</p>
            </div>
        </section>

        <!-- Сэтгэгдэл үлдээх хэсэг -->
        <div class="glass shadow-xl rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center gap-2">
                <span>💬</span> Тогооч руу санал хүсэлт илгээх
            </h2>
            <form id="feedbackForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="fbName" required placeholder="Таны нэр" class="px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80">
                    <select id="fbDepartment" required class="px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80">
                    <option value="">-- Салбараа сонгоно уу --</option>
                    <option value="Удирдлага">Удирдлага</option>
                    <option value="Техник тасаг">Техник тасаг</option>
                    <option value="Санхүү тасаг">Санхүү тасаг</option>
                    <option value="Хүний нөөц">Хүний нөөц</option>
                    <option value="Зам оношилгоо">Зам оношилгоо</option>
                    <option value="АХО">АХО</option>
                    <option value="Замын 16-р хэсэг">Замын 16-р хэсэг</option>
                    <option value="Бусад">Бусад</option>
                    </select>
                </div>
                <textarea id="commentText" rows="3" required placeholder="Хоолны амт, чанар болон бусад саналаа бичнэ үү..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white/80"></textarea>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-500/30">
                    Санал илгээх
                </button>
            </form>
        </div>
    </div>

    <!-- Script холболт -->
    <script>
        // Supabase тохиргоо (Өөрийн түлхүүрээр солино уу)
        const SUPABASE_URL = 'https://fvgdqcjzgeqctowcdgtp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PhWvqNl8S-s8n7kTUFEFoA_DNh7xPl8';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedMealId = null;
        let menuRequestId = 0;
        const menuDateInput = document.getElementById('menuDate');

        function getLocalDateString(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function copyBankAccount(button) {
            try {
                await navigator.clipboard.writeText('880005005005475939');
                const status = button.querySelector('[aria-live="polite"]');
                status.textContent = 'Хуулагдлаа';
                setTimeout(() => { status.textContent = ''; }, 2000);
            } catch (error) {
                console.error('Дансны дугаар хуулахад алдаа гарлаа:', error);
                alert('Дансны дугаарыг хуулах боломжгүй байна. Дугаарыг гараар хуулна уу.');
            }
        }

        async function loadMenu(date = menuDateInput.value) {
            const requestId = ++menuRequestId;
            selectedMealId = null;
            document.querySelectorAll('.meal-card').forEach(card => card.classList.remove('border-indigo-600', 'bg-indigo-50/50'));
            const container = document.getElementById('menuContainer');
            container.innerHTML = '<p class="text-sm text-slate-500 col-span-3">Цэс ачаалж байна...</p>';

            const { data, error } = await _supabase
                .from('menu_items')
                .select('*')
                .eq('date', date);

            if (requestId !== menuRequestId) return;

            if (error) {
                console.error('Цэс татахад алдаа гарлаа:', error);
                container.innerHTML = '';
                const message = document.createElement('p');
                message.className = 'text-sm text-red-600 col-span-3';
                message.textContent = 'Цэс ачаалж чадсангүй: ' + error.message;
                container.appendChild(message);
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-sm text-amber-600 col-span-3">Энэ өдрийн хоолны цэс ороогүй байна.</p>';
                return;
            }

            container.innerHTML = data.map((meal, index) => `
                <div class="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 transition bg-white/50 meal-card" data-id="${meal.id}" onclick="selectMeal('${meal.id}', this)">
                    <img src="${meal.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" alt="Хоол" class="w-full h-32 object-cover rounded-lg mb-3">
                    <h3 class="font-semibold text-slate-800">${meal.title}</h3>
                    <p class="text-xs text-slate-500 mt-1">${meal.description || ''}</p>
                </div>
            `).join('');
        }

        let loadedOrders = [];
        let ordersRequestId = 0;
        let ordersLoaded = false;
        const ordersDateInput = document.getElementById('ordersDate');
        const ordersDepartment = document.getElementById('ordersDepartment');
        const ordersEmployee = document.getElementById('ordersEmployee');
        const ordersMeal = document.getElementById('ordersMeal');

        function updateOrderOptions(select, entries, allLabel) {
            const previousValue = select.value;
            select.replaceChildren(new Option(allLabel, ''));
            entries.forEach(([value, label]) => select.add(new Option(label, value)));
            select.value = entries.some(([value]) => value === previousValue) ? previousValue : '';
        }

        function renderOrders() {
            if (!ordersLoaded) return;
            const container = document.getElementById('myOrdersContainer');
            const departmentOrders = loadedOrders.filter(order => !ordersDepartment.value || order.department === ordersDepartment.value);
            const employees = [...new Set(departmentOrders.map(order => order.employee_name))].sort((a, b) => a.localeCompare(b, 'mn'));
            updateOrderOptions(ordersEmployee, employees.map(name => [name, name]), 'Бүх ажилтан');
            const employeeOrders = departmentOrders.filter(order => !ordersEmployee.value || order.employee_name === ordersEmployee.value);
            const meals = new Map(employeeOrders.map(order => [String(order.meal_id), order.menu_items.title]));
            updateOrderOptions(ordersMeal, [...meals].sort((a, b) => a[1].localeCompare(b[1], 'mn')), 'Бүх хоол');
            const orders = employeeOrders.filter(order => !ordersMeal.value || String(order.meal_id) === ordersMeal.value);

            if (orders.length === 0) {
                container.textContent = 'Сонгосон нөхцөлөөр захиалга олдсонгүй.';
                return;
            }

            const summary = document.createElement('p');
            summary.className = 'text-sm font-semibold text-indigo-700 mb-3';
            summary.textContent = `Нийт: ${orders.length} захиалга, ${orders.reduce((total, order) => total + order.quantity, 0)} порц`;
            const wrapper = document.createElement('div');
            wrapper.className = 'overflow-x-auto';
            const table = document.createElement('table');
            table.className = 'w-full text-left text-sm';
            table.innerHTML = '<thead><tr class="border-b border-slate-200 text-slate-500"><th scope="col" class="p-2">Салбар</th><th scope="col" class="p-2">Ажилтан</th><th scope="col" class="p-2">Хоол</th><th scope="col" class="p-2">Порц</th></tr></thead>';
            const body = document.createElement('tbody');
            orders.forEach(order => {
                const row = document.createElement('tr');
                row.className = 'border-b border-slate-100';
                [order.department, order.employee_name, order.menu_items.title, order.quantity].forEach(value => {
                    const cell = document.createElement('td');
                    cell.className = 'p-2';
                    cell.textContent = value;
                    row.appendChild(cell);
                });
                body.appendChild(row);
            });
            table.appendChild(body);
            wrapper.appendChild(table);
            container.replaceChildren(summary, wrapper);
        }

        async function loadMyOrders() {
            const requestId = ++ordersRequestId;
            const container = document.getElementById('myOrdersContainer');
            const button = document.getElementById('loadMyOrders');
            ordersLoaded = false;
            loadedOrders = [];
            if (!ordersDateInput.value) {
                button.disabled = false;
                button.textContent = 'Шинэчлэх';
                container.textContent = 'Хоолны өдрөө сонгоно уу.';
                return;
            }
            const date = ordersDateInput.value;
            button.disabled = true;
            button.textContent = 'Ачаалж байна...';
            container.textContent = 'Захиалгуудыг ачаалж байна...';

            try {
                const orders = [];
                const pageSize = 500;
                for (let offset = 0; ; offset += pageSize) {
                    const { data, error } = await _supabase
                        .from('orders')
                        .select('id, department, employee_name, meal_id, quantity, menu_items!inner(title, date)')
                        .eq('menu_items.date', date)
                        .order('id')
                        .range(offset, offset + pageSize - 1);
                    if (requestId !== ordersRequestId) return;
                    if (error) throw error;
                    orders.push(...data);
                    if (data.length < pageSize) break;
                }
                loadedOrders = orders;
                ordersLoaded = true;
                renderOrders();
            } catch (error) {
                if (requestId !== ordersRequestId) return;
                console.error('Захиалга татахад алдаа гарлаа:', error);
                container.textContent = 'Захиалгуудыг ачаалж чадсангүй: ' + error.message;
            } finally {
                if (requestId === ordersRequestId) {
                    button.disabled = false;
                    button.textContent = 'Шинэчлэх';
                }
            }
        }

        ordersDateInput.value = getLocalDateString();
        Array.from(document.getElementById('department').options).forEach(option => {
            ordersDepartment.add(new Option(option.textContent, option.value));
        });
        ordersDateInput.addEventListener('change', () => loadMyOrders());
        [ordersDepartment, ordersEmployee, ordersMeal].forEach(select => select.addEventListener('change', renderOrders));
        document.getElementById('loadMyOrders').addEventListener('click', () => loadMyOrders());

        function selectMeal(id, element) {
            document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('border-indigo-600', 'bg-indigo-50/50'));
            element.classList.add('border-indigo-600', 'bg-indigo-50/50');
            selectedMealId = id;
        }

        menuDateInput.value = getLocalDateString();
        menuDateInput.addEventListener('change', () => loadMenu());
        document.getElementById('previousDay').addEventListener('click', () => {
            const date = new Date(`${menuDateInput.value}T12:00:00`);
            date.setDate(date.getDate() - 1);
            menuDateInput.value = getLocalDateString(date);
            loadMenu();
        });
        document.getElementById('nextDay').addEventListener('click', () => {
            const date = new Date(`${menuDateInput.value}T12:00:00`);
            date.setDate(date.getDate() + 1);
            menuDateInput.value = getLocalDateString(date);
            loadMenu();
        });

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedMealId) {
                alert('Та захиалах хоолоо сонгоно уу!');
                return;
            }

            const department = document.getElementById('department').value;
            const employeeName = document.getElementById('employeeName').value;
            const quantity = parseInt(document.getElementById('quantity').value);

            const { error } = await _supabase.from('orders').insert([
                { department, employee_name: employeeName, meal_id: selectedMealId, quantity }
            ]);

            if (error) {
                alert('Алдаа гарлаа: ' + error.message);
            } else {
                alert('Захиалга амжилттай бүртгэгдлээ. Баярлалаа!');
                const selectedDate = menuDateInput.value;
                document.getElementById('orderForm').reset();
                document.getElementById('department').value = department;
                document.getElementById('employeeName').value = employeeName;
                menuDateInput.value = selectedDate;
                document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('border-indigo-600', 'bg-indigo-50/50'));
                selectedMealId = null;
                ordersDateInput.value = selectedDate;
                ordersDepartment.value = '';
                ordersEmployee.value = '';
                ordersMeal.value = '';
                await loadMyOrders();
            }
        });

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const department = document.getElementById('fbDepartment').value;
            const employee_name = document.getElementById('fbName').value;
            const comment = document.getElementById('commentText').value;

            const { error } = await _supabase.from('feedbacks').insert([{ department, employee_name, comment }]);

            if (error) {
                alert('Алдаа гарлаа: ' + error.message);
            } else {
                alert('Санал хүсэлтийг амжилттай илгээлээ.');
                document.getElementById('feedbackForm').reset();
            }
        });

        loadMenu();
        loadMyOrders();
    </script>
</body>
</html>
